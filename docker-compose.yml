services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: specwars_user
      POSTGRES_PASSWORD: specwars_password
      POSTGRES_DB: specwars_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
